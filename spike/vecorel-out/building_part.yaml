$schema: https://vecorel.org/sdl/v0.2.0/schema.json
required:
- id
- geometry
- theme
- type
- version
- building_id
properties:
  id:
    type: string
    minLength: 1
    pattern: ^\S+$
    description: "A feature ID. This may be an ID associated with the Global Entity\
      \ Reference System (GERS) if\u2014and-only-if the feature represents an entity\
      \ that is part of GERS."
  bbox:
    type: bounding-box
    description: An optional bounding box for the feature
  geometry:
    type: geometry
    geometryTypes:
    - MultiPolygon
    - Polygon
    description: The footprint or roofprint of the building part.
  theme:
    type: string
    enum:
    - buildings
  type:
    type: string
    enum:
    - building_part
  version:
    type: int32
    minimum: -2147483648
    maximum: 2147483647
  sources:
    type: array
    items:
      type: object
      properties:
        property:
          type: string
          description: 'A JSON Pointer identifying the property (field) that this
            source information applies to.


            The root document value `""` indicates that this source information applies
            to the

            entire feature, excepting properties (fields) for which a dedicated source
            information

            record exists.


            Any other JSON Pointer apart from `""` indicates that this source record
            provides

            dedicated source information for the property at the path in the JSON
            Pointer. As an

            example, the value `"/names/common/en"` indicates that the source information
            applies to

            the English common name of a named feature, while the value `"/geometry"`
            indicates that

            it applies to the feature geometry.'
        dataset:
          type: string
          description: Name of the dataset where the source data can be found.
        license:
          type: string
          pattern: ^(\S(.*\S)?)?\Z
          description: 'Source data license name.


            This should be a valid SPDX license identifier when available.


            If omitted, contact the data provider for more license information.'
        record_id:
          type: string
          description: 'Identifies the specific record within the source dataset where
            the source data can

            be found.


            The format of record identifiers is dataset-specific.'
        update_time:
          type: date-time
          description: Last update time of the source data record.
        confidence:
          type: double
          minimum: 0.0
          maximum: 1.0
          description: 'Confidence value from the source dataset.


            This is a value between 0.0 and 1.0 and is particularly relevant for ML-derived
            data.'
        provider:
          type: string
          minLength: 1
          pattern: ^[a-z0-9]+(_[a-z0-9]+)*$
          description: 'The provider label for the entity that contributed this data

            (e.g., osm, meta, esri).'
        resource:
          type: string
          minLength: 1
          pattern: ^[a-z0-9]+(_[a-z0-9]+)*$
          description: 'The subject or type of data contributed by the provider

            (e.g., planet, buildings, division_names).'
        version:
          type: string
          minLength: 1
          pattern: ^\S+$
          description: 'A sortable identifier for the specific snapshot of the resource

            (e.g., 2026-02-13, 5.3, A5692).'
        between:
          type: array
          items:
            type: double
            minimum: 0.0
            maximum: 1.0
          minItems: 2
          maxItems: 2
          description: The linearly-referenced sub-segment of the geometry, specified
            as a range (pair) of percentage displacements from the start of the geometry,
            that the containing SourceItem applies to.
      required:
      - property
      description: Specifies the source of the data used for a feature or one of its
        properties.
      additionalProperties: false
    minItems: 1
    uniqueItems: true
    description: Information about the source data used to assemble the feature.
  building_id:
    type: string
    minLength: 1
    pattern: ^\S+$
    description: The building to which this part belongs
  names:
    type: object
    properties:
      primary:
        type: string
        minLength: 1
        pattern: ^(\S(.*\S)?)?\Z
        description: The most commonly used name.
      common:
        type: object
        patternProperties:
          ? ^(?:(?:[A-Za-z]{2,3}(?:-[A-Za-z]{3}){0,3}?)|(?:[A-Za-z]{4,8}))(?:-[A-Za-z]{4})?(?:-[A-Za-z]{2}|[0-9]{3})?(?:-(?:[A-Za-z0-9]{5,8}|[0-9][A-Za-z0-9]{3}))*(?:-[A-WY-Za-wy-z0-9](?:-[A-Za-z0-9]{2,8})+)*$
          : type: string
            pattern: ^(\S(.*\S)?)?\Z
      rules:
        type: array
        items:
          type: object
          properties:
            value:
              type: string
              minLength: 1
              pattern: ^(\S(.*\S)?)?\Z
              description: The actual name value.
            variant:
              type: string
              enum:
              - common
              - official
              - alternate
              - short
              description: The name variant for this name rule.
            language:
              type: string
              pattern: ^(?:(?:[A-Za-z]{2,3}(?:-[A-Za-z]{3}){0,3}?)|(?:[A-Za-z]{4,8}))(?:-[A-Za-z]{4})?(?:-[A-Za-z]{2}|[0-9]{3})?(?:-(?:[A-Za-z0-9]{5,8}|[0-9][A-Za-z0-9]{3}))*(?:-[A-WY-Za-wy-z0-9](?:-[A-Za-z0-9]{2,8})+)*$
              description: 'The language in which the name `value` is specified, if
                known, as an IETF BCP 47

                language tag.'
            perspectives:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                  - accepted_by
                  - disputed_by
                  description: Whether the perspective holder accepts or disputes
                    this name.
                countries:
                  type: array
                  items:
                    type: string
                    pattern: ^[A-Z]{2}$
                    minLength: 2
                    maxLength: 2
                  minItems: 1
                  uniqueItems: true
                  description: Countries holding the given mode of perspective.
              required:
              - mode
              - countries
              description: Political perspectives from which a named feature is viewed.
              additionalProperties: false
            between:
              type: array
              items:
                type: double
                minimum: 0.0
                maximum: 1.0
              minItems: 2
              maxItems: 2
              description: The linearly-referenced sub-segment of the geometry, specified
                as a range (pair) of percentage displacements from the start of the
                geometry, that the containing NameRule applies to.
            side:
              type: string
              enum:
              - left
              - right
              description: The side, either left or right, that the containing NameRule
                applies to.
          required:
          - value
          - variant
          description: "A rule that can be evaluated to determine the name in advanced\
            \ scenarios.\n\nName rules are used for cases where the primary name is\
            \ not sufficient; the common name is not\nthe right fit for the use case\
            \ and another variant is needed; or where the name only applies in\ncertain\
            \ specific circumstances.\n\nExamples might include:\n- An official, alternate,\
            \ or short name.\n- A name that only applies to part of a linear path\
            \ like a road segment (geometric range\n  scoping).\n- A name that only\
            \ applies to the left or right side of a linear path like a road segment\
            \ (side\n  scoping).\n- A name that is only accepted by some political\
            \ perspectives."
          additionalProperties: false
        description: Rules for names that cannot be specified in the simple common
          names property. These rules can cover other name variants such as official,
          alternate, and short; and they can optionally include geometric scoping
          (linear referencing) and side-of-road scoping for complex cases.
    required:
    - primary
    description: All known names by which the feature is called
    additionalProperties: false
  level:
    type: int32
    minimum: -2147483648
    maximum: 2147483647
    description: Z-order of the feature where 0 is visual level
  height:
    type: double
    exclusiveMinimum: 0
    description: 'Height of the building or part in meters.


      This is the distance from the lowest point to the highest point.'
  is_underground:
    type: boolean
    description: 'Whether the entire building or part is completely below ground.


      The underground flag is useful for display purposes. Buildings and building
      parts

      that are entirely below ground can be styled differently or omitted from the

      rendered image.


      This flag is conceptually different from the `level` field, which indicates

      relative z-ordering and, notably, can be negative even if the building is entirely

      above-ground.'
  num_floors:
    type: int32
    exclusiveMinimum: 0
    minimum: -2147483648
    maximum: 2147483647
    description: Number of above-ground floors of the building or part.
  num_floors_underground:
    type: int32
    exclusiveMinimum: 0
    minimum: -2147483648
    maximum: 2147483647
    description: Number of below-ground floors of the building or part.
  min_height:
    type: double
    description: 'Altitude above ground where the bottom of the building or building
      part starts.


      If present, this value indicates that the lowest part of the building or building

      part starts is above ground level.'
  min_floor:
    type: int32
    exclusiveMinimum: 0
    minimum: -2147483648
    maximum: 2147483647
    description: 'Start floor of this building or part.


      If present, this value indicates that the building or part is "floating" and
      its

      bottom-most floor is above ground level, usually because it is part of a larger

      building in which some parts do reach down to ground level. An example is a
      building

      that has an entry road or driveway at ground level into an interior courtyard,
      where

      part of the building bridges above the entry road. This property may sometimes
      be

      populated when `min_height` is missing and in these cases can be used as a proxy
      for

      `min_height`.'
  facade_color:
    type: string
    pattern: ^#[0-9A-Fa-f]{3}([0-9A-Fa-f]{3})?$
    description: Facade color in `#rgb` or `#rrggbb` hex notation
  facade_material:
    type: string
    enum:
    - brick
    - cement_block
    - clay
    - concrete
    - glass
    - metal
    - plaster
    - plastic
    - stone
    - timber_framing
    - wood
    description: Outer surface material of the facade
  roof_material:
    type: string
    enum:
    - concrete
    - copper
    - eternit
    - glass
    - grass
    - gravel
    - metal
    - plastic
    - roof_tiles
    - slate
    - solar_panels
    - tar_paper
    - thatch
    - wood
    description: Outer surface material of the roof
  roof_shape:
    type: string
    enum:
    - dome
    - flat
    - gabled
    - gambrel
    - half_hipped
    - hipped
    - mansard
    - onion
    - pyramidal
    - round
    - saltbox
    - sawtooth
    - skillion
    - spherical
    description: Shape of the roof
  roof_direction:
    type: double
    minimum: 0
    exclusiveMaximum: 360
    description: Bearing of the roof ridge line in degrees
  roof_orientation:
    type: string
    enum:
    - across
    - along
    description: Orientation of the roof shape relative to the footprint shape
  roof_color:
    type: string
    pattern: ^#[0-9A-Fa-f]{3}([0-9A-Fa-f]{3})?$
    description: The roof color in `#rgb` or `#rrggbb` hex notation
  roof_height:
    type: double
    description: 'Height of the roof in meters.


      This is the distance from the base of the roof to its highest point.'
