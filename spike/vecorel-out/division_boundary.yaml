$schema: https://vecorel.org/sdl/v0.2.0/schema.json
required:
- id
- geometry
- theme
- type
- version
- subtype
- class
- division_ids
properties:
  id:
    type: string
    minLength: 1
    pattern: ^\S+$
    description: "A feature ID. This may be an ID associated with the Global Entity\
      \ Reference System (GERS) if\u2014and-only-if the feature represents an entity\
      \ that is part of GERS."
  bbox:
    type: bounding-box
    description: An optional bounding box for the feature
  geometry:
    type: geometry
    geometryTypes:
    - LineString
    - MultiLineString
    description: Boundary line or lines
  theme:
    type: string
    enum:
    - divisions
  type:
    type: string
    enum:
    - division_boundary
  version:
    type: int32
    minimum: -2147483648
    maximum: 2147483647
  sources:
    type: array
    items:
      type: object
      properties:
        property:
          type: string
          description: 'A JSON Pointer identifying the property (field) that this
            source information applies to.


            The root document value `""` indicates that this source information applies
            to the

            entire feature, excepting properties (fields) for which a dedicated source
            information

            record exists.


            Any other JSON Pointer apart from `""` indicates that this source record
            provides

            dedicated source information for the property at the path in the JSON
            Pointer. As an

            example, the value `"/names/common/en"` indicates that the source information
            applies to

            the English common name of a named feature, while the value `"/geometry"`
            indicates that

            it applies to the feature geometry.'
        dataset:
          type: string
          description: Name of the dataset where the source data can be found.
        license:
          type: string
          pattern: ^(\S(.*\S)?)?\Z
          description: 'Source data license name.


            This should be a valid SPDX license identifier when available.


            If omitted, contact the data provider for more license information.'
        record_id:
          type: string
          description: 'Identifies the specific record within the source dataset where
            the source data can

            be found.


            The format of record identifiers is dataset-specific.'
        update_time:
          type: date-time
          description: Last update time of the source data record.
        confidence:
          type: double
          minimum: 0.0
          maximum: 1.0
          description: 'Confidence value from the source dataset.


            This is a value between 0.0 and 1.0 and is particularly relevant for ML-derived
            data.'
        provider:
          type: string
          minLength: 1
          pattern: ^[a-z0-9]+(_[a-z0-9]+)*$
          description: 'The provider label for the entity that contributed this data

            (e.g., osm, meta, esri).'
        resource:
          type: string
          minLength: 1
          pattern: ^[a-z0-9]+(_[a-z0-9]+)*$
          description: 'The subject or type of data contributed by the provider

            (e.g., planet, buildings, division_names).'
        version:
          type: string
          minLength: 1
          pattern: ^\S+$
          description: 'A sortable identifier for the specific snapshot of the resource

            (e.g., 2026-02-13, 5.3, A5692).'
        between:
          type: array
          items:
            type: double
            minimum: 0.0
            maximum: 1.0
          minItems: 2
          maxItems: 2
          description: The linearly-referenced sub-segment of the geometry, specified
            as a range (pair) of percentage displacements from the start of the geometry,
            that the containing SourceItem applies to.
      required:
      - property
      description: Specifies the source of the data used for a feature or one of its
        properties.
      additionalProperties: false
    minItems: 1
    uniqueItems: true
    description: Information about the source data used to assemble the feature.
  subtype:
    type: string
    enum:
    - country
    - dependency
    - macroregion
    - region
    - macrocounty
    - county
    - localadmin
    - locality
    - borough
    - macrohood
    - neighborhood
    - microhood
    description: 'A broad classification of the divisions this boundary separates
      (e.g., country,

      region, locality, etc.).'
  class:
    type: string
    enum:
    - land
    - maritime
    description: 'The kind of boundary: land or maritime.'
  is_land:
    type: boolean
    description: 'Flag indicating whether or not the feature geometry represents the
      land-clipped,

      non-maritime boundary. The geometry can be used for map rendering, cartographic

      display, and similar purposes.'
  is_territorial:
    type: boolean
    description: 'Flag indicating whether or not the feature geometry represents Overture''s
      best

      approximation of the division''s territorial boundary. For coastal places, this
      will

      tend to include the water area. The geometry can be used for data processing,

      reverse-geocoding, and similar purposes.'
  division_ids:
    type: array
    items:
      type: string
      minLength: 1
      pattern: ^\S+$
    minItems: 2
    maxItems: 2
    uniqueItems: true
    description: 'Identifies the two divisions to the left and right, respectively,
      of the

      boundary line. The left- and right-hand sides of the boundary are considered

      from the perspective of a person standing on the line facing in the direction

      in which the geometry is oriented, i.e. facing toward the end of the line.


      The first array element is the Overture ID of the left division. The second

      element is the Overture ID of the right division.'
  country:
    type: string
    pattern: ^[A-Z]{2}$
    minLength: 2
    maxLength: 2
    description: 'ISO 3166-1 alpha-2 country code of the country or country-like entity
      that

      both sides of the boundary share.


      This property will be present on boundaries between two regions, counties,

      or similar entities within the same country, but will not be present on

      boundaries between two countries or country-like entities.'
  region:
    type: string
    pattern: ^[A-Z]{2}-[A-Z0-9]{1,3}$
    minLength: 4
    maxLength: 6
    description: 'ISO 3166-2 principal subdivision code of the subdivision-like entity
      that

      both sides of the boundary share.


      This property will be present on boundaries between two counties, localadmins

      or similar entities within the same principal subdivision, but will not be

      present on boundaries between different principal subdivisions or countries.'
  admin_level:
    type: int32
    minimum: -2147483648
    maximum: 2147483647
    description: 'Integer representing the division''s position in its country''s
      administrative

      hierarchy, where lower numbers correspond to higher level administrative units.'
  is_disputed:
    type: boolean
    description: 'Flag indicating whether this boundary is either disputed outright
      or is a "best

      guess" in a case where the boundary between two divisions is unclear.


      If the boundary is disputed outright, this flag is true and the entities disputing

      it are listed in the `perspectives` property. If the boundary is simply a "best

      guess", this flag is true but no disputing entities are listed in `perspectives`.'
  perspectives:
    type: object
    properties:
      mode:
        type: string
        enum:
        - accepted_by
        - disputed_by
        description: Whether the perspective holder accepts or disputes this name.
      countries:
        type: array
        items:
          type: string
          pattern: ^[A-Z]{2}$
          minLength: 2
          maxLength: 2
        minItems: 1
        uniqueItems: true
        description: Countries holding the given mode of perspective.
    required:
    - mode
    - countries
    description: "Political perspectives from which this division boundary is considered\
      \ to be\nan accurate representation.\n\nIf this property is absent, then this\
      \ boundary is not known to be disputed\nfrom any political perspective. Consequently,\
      \ there is only one boundary\nfeature representing the entire real world entity.\n\
      \nIf this property is present, it means the boundary represents one of several\n\
      alternative perspectives on the same real-world entity.\n\nThere are two modes\
      \ of perspective:\n\n1. `accepted_by` means the representation of the boundary\
      \ is accepted by the\n   listed entities and would be included on a map drawn\
      \ from their perspective.\n\n2. `disputed_by` means the representation of the\
      \ boundary is disputed by the\n   listed entities and would be excluded from\
      \ a map drawn from their\n   perspective.\n\nWhen drawing a map from the perspective\
      \ of a given country, one would start by\ngathering all the undisputed boundaries\
      \ (those with no `perspectives` value); and\nthen adding to that: first, all\
      \ boundaries explicitly accepted by the country, and\nsecond, all boundaries\
      \ not explicitly disputed by the country."
    additionalProperties: false
