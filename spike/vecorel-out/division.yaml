$schema: https://vecorel.org/sdl/v0.2.0/schema.json
required:
- names
- id
- geometry
- theme
- type
- version
- subtype
- country
- hierarchies
properties:
  cartography:
    type: object
    properties:
      prominence:
        type: int32
        minimum: -2147483648
        maximum: 2147483647
        description: 'Subjective scale of feature significance or importance, with
          1 being the least, and

          100 being the most, significant.


          This value can be used to help drive decisions about how and when to display
          a

          feature, and how to treat it relative to neighboring features.


          When populated by Overture, this value is derived from various factors including,

          but not limited to: feature and subtype, population, and capital status.'
      min_zoom:
        type: int32
        minimum: -2147483648
        maximum: 2147483647
        description: 'Recommended minimum tile zoom level in which this feature should
          be displayed.


          It is recommended that the feature be hidden at zoom levels below this value.


          Zoom levels follow the Slippy Maps convention, documented in the following

          references:

          - https://wiki.openstreetmap.org/wiki/Slippy_map_tilenames

          - https://www.maptiler.com/google-maps-coordinates-tile-bounds-projection'
      max_zoom:
        type: int32
        minimum: -2147483648
        maximum: 2147483647
        description: 'Recommended maximum tile zoom level in which this feature should
          be displayed.


          It is recommended that the feature be hidden at zoom levels above this value.


          Zoom levels follow the Slippy Maps convention, documented in the following

          references:

          - https://wiki.openstreetmap.org/wiki/Slippy_map_tilenames

          - https://www.maptiler.com/google-maps-coordinates-tile-bounds-projection'
      sort_key:
        type: int32
        minimum: -2147483648
        maximum: 2147483647
        description: 'Integer indicating the recommended order in which to draw features.


          Features with a lower number should be drawn "in front" of features with
          a higher

          number.'
    description: Cartographic hints useful when including the feature in maps
    additionalProperties: false
  names:
    type: object
    properties:
      primary:
        type: string
        minLength: 1
        pattern: ^(\S(.*\S)?)?\Z
        description: The most commonly used name.
      common:
        type: object
        patternProperties:
          ? ^(?:(?:[A-Za-z]{2,3}(?:-[A-Za-z]{3}){0,3}?)|(?:[A-Za-z]{4,8}))(?:-[A-Za-z]{4})?(?:-[A-Za-z]{2}|[0-9]{3})?(?:-(?:[A-Za-z0-9]{5,8}|[0-9][A-Za-z0-9]{3}))*(?:-[A-WY-Za-wy-z0-9](?:-[A-Za-z0-9]{2,8})+)*$
          : type: string
            pattern: ^(\S(.*\S)?)?\Z
      rules:
        type: array
        items:
          type: object
          properties:
            value:
              type: string
              minLength: 1
              pattern: ^(\S(.*\S)?)?\Z
              description: The actual name value.
            variant:
              type: string
              enum:
              - common
              - official
              - alternate
              - short
              description: The name variant for this name rule.
            language:
              type: string
              pattern: ^(?:(?:[A-Za-z]{2,3}(?:-[A-Za-z]{3}){0,3}?)|(?:[A-Za-z]{4,8}))(?:-[A-Za-z]{4})?(?:-[A-Za-z]{2}|[0-9]{3})?(?:-(?:[A-Za-z0-9]{5,8}|[0-9][A-Za-z0-9]{3}))*(?:-[A-WY-Za-wy-z0-9](?:-[A-Za-z0-9]{2,8})+)*$
              description: 'The language in which the name `value` is specified, if
                known, as an IETF BCP 47

                language tag.'
            perspectives:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                  - accepted_by
                  - disputed_by
                  description: Whether the perspective holder accepts or disputes
                    this name.
                countries:
                  type: array
                  items:
                    type: string
                    pattern: ^[A-Z]{2}$
                    minLength: 2
                    maxLength: 2
                  minItems: 1
                  uniqueItems: true
                  description: Countries holding the given mode of perspective.
              required:
              - mode
              - countries
              description: Political perspectives from which a named feature is viewed.
              additionalProperties: false
            between:
              type: array
              items:
                type: double
                minimum: 0.0
                maximum: 1.0
              minItems: 2
              maxItems: 2
              description: The linearly-referenced sub-segment of the geometry, specified
                as a range (pair) of percentage displacements from the start of the
                geometry, that the containing NameRule applies to.
            side:
              type: string
              enum:
              - left
              - right
              description: The side, either left or right, that the containing NameRule
                applies to.
          required:
          - value
          - variant
          description: "A rule that can be evaluated to determine the name in advanced\
            \ scenarios.\n\nName rules are used for cases where the primary name is\
            \ not sufficient; the common name is not\nthe right fit for the use case\
            \ and another variant is needed; or where the name only applies in\ncertain\
            \ specific circumstances.\n\nExamples might include:\n- An official, alternate,\
            \ or short name.\n- A name that only applies to part of a linear path\
            \ like a road segment (geometric range\n  scoping).\n- A name that only\
            \ applies to the left or right side of a linear path like a road segment\
            \ (side\n  scoping).\n- A name that is only accepted by some political\
            \ perspectives."
          additionalProperties: false
        description: Rules for names that cannot be specified in the simple common
          names property. These rules can cover other name variants such as official,
          alternate, and short; and they can optionally include geometric scoping
          (linear referencing) and side-of-road scoping for complex cases.
    required:
    - primary
    description: All known names by which the division is called
    additionalProperties: false
  id:
    type: string
    minLength: 1
    pattern: ^\S+$
    description: "A feature ID. This may be an ID associated with the Global Entity\
      \ Reference System (GERS) if\u2014and-only-if the feature represents an entity\
      \ that is part of GERS."
  bbox:
    type: bounding-box
    description: An optional bounding box for the feature
  geometry:
    type: geometry
    geometryTypes:
    - Point
    description: 'Approximate location of a position commonly associated with the
      real-world entity

      modeled by the division feature.'
  theme:
    type: string
    enum:
    - divisions
  type:
    type: string
    enum:
    - division
  version:
    type: int32
    minimum: -2147483648
    maximum: 2147483647
  sources:
    type: array
    items:
      type: object
      properties:
        property:
          type: string
          description: 'A JSON Pointer identifying the property (field) that this
            source information applies to.


            The root document value `""` indicates that this source information applies
            to the

            entire feature, excepting properties (fields) for which a dedicated source
            information

            record exists.


            Any other JSON Pointer apart from `""` indicates that this source record
            provides

            dedicated source information for the property at the path in the JSON
            Pointer. As an

            example, the value `"/names/common/en"` indicates that the source information
            applies to

            the English common name of a named feature, while the value `"/geometry"`
            indicates that

            it applies to the feature geometry.'
        dataset:
          type: string
          description: Name of the dataset where the source data can be found.
        license:
          type: string
          pattern: ^(\S(.*\S)?)?\Z
          description: 'Source data license name.


            This should be a valid SPDX license identifier when available.


            If omitted, contact the data provider for more license information.'
        record_id:
          type: string
          description: 'Identifies the specific record within the source dataset where
            the source data can

            be found.


            The format of record identifiers is dataset-specific.'
        update_time:
          type: date-time
          description: Last update time of the source data record.
        confidence:
          type: double
          minimum: 0.0
          maximum: 1.0
          description: 'Confidence value from the source dataset.


            This is a value between 0.0 and 1.0 and is particularly relevant for ML-derived
            data.'
        provider:
          type: string
          minLength: 1
          pattern: ^[a-z0-9]+(_[a-z0-9]+)*$
          description: 'The provider label for the entity that contributed this data

            (e.g., osm, meta, esri).'
        resource:
          type: string
          minLength: 1
          pattern: ^[a-z0-9]+(_[a-z0-9]+)*$
          description: 'The subject or type of data contributed by the provider

            (e.g., planet, buildings, division_names).'
        version:
          type: string
          minLength: 1
          pattern: ^\S+$
          description: 'A sortable identifier for the specific snapshot of the resource

            (e.g., 2026-02-13, 5.3, A5692).'
        between:
          type: array
          items:
            type: double
            minimum: 0.0
            maximum: 1.0
          minItems: 2
          maxItems: 2
          description: The linearly-referenced sub-segment of the geometry, specified
            as a range (pair) of percentage displacements from the start of the geometry,
            that the containing SourceItem applies to.
      required:
      - property
      description: Specifies the source of the data used for a feature or one of its
        properties.
      additionalProperties: false
    minItems: 1
    uniqueItems: true
    description: Information about the source data used to assemble the feature.
  subtype:
    type: string
    enum:
    - country
    - dependency
    - macroregion
    - region
    - macrocounty
    - county
    - localadmin
    - locality
    - borough
    - macrohood
    - neighborhood
    - microhood
    description: A broad classification of the division (e.g., country, region, locality,
      etc.).
  country:
    type: string
    pattern: ^[A-Z]{2}$
    minLength: 2
    maxLength: 2
    description: 'ISO 3166-1 alpha-2 country code of the country or country-like entity,
      that this

      division represents or belongs to.


      If the entity this division represents has a country code, the country property

      contains it. If it does not, the country property contains the country code
      of the

      first division encountered by traversing the parent_division_id chain to the
      root.


      For example:

      - The country value for the United States is ''US''

      - The country value for New York City is ''US''

      - The country value for Puerto Rico, a dependency of the US, is ''PR''.

      - The country value for San Juan, Puerto Rico is ''PR''.


      If an entity has an internationally-recognized ISO 3166-1 alpha-2 country code,
      it

      should always be used. In cases where the schema requires the code but no

      internationally-recognized code is available, a synthetic code may be used provided

      it does not conflict with any internationally-recognized codes.'
  hierarchies:
    type: array
    items:
      type: array
      items:
        type: object
        properties:
          division_id:
            type: string
            minLength: 1
            pattern: ^\S+$
            description: 'ID of a division that is an ancestor of the current division.


              In the context of division hierarchies, the ancestor divisions of a
              division include

              the division itself, and any other division that is an ancestor of the
              division''s parent.'
          subtype:
            type: string
            enum:
            - country
            - dependency
            - macroregion
            - region
            - macrocounty
            - county
            - localadmin
            - locality
            - borough
            - macrohood
            - neighborhood
            - microhood
          name:
            type: string
            minLength: 1
            pattern: ^(\S(.*\S)?)?\Z
            description: Primary name of the division
        required:
        - division_id
        - subtype
        - name
        description: One division in a hierarchy.
        additionalProperties: false
      minItems: 1
      uniqueItems: true
    minItems: 1
    uniqueItems: true
    description: 'Hierarchies in which this division participates.


      Every division participates in at least one hierarchy. Most participate in only
      one.

      Some divisions may participate in more than one hierarchy, for example if they
      are

      claimed by different parent divisions from different political perspectives;
      or if

      there are other real-world reasons why the division or one of its ancestors
      has

      multiple parents.


      The first hierarchy in the list is the default hierarchy, and the second-to-last

      entry in the default hierarchy (if there is such an entry) always corresponds
      to the

      `parent_division_id` property. The ordering of hierarchies after the first one
      is

      arbitrary.'
  parent_division_id:
    type: string
    minLength: 1
    pattern: ^\S+$
    description: 'Division ID of this division''s parent division.


      Not allowed for top-level divisions (countries) and required for all other

      divisions.


      The default parent division is the parent division as seen from the default

      political perspective, if there is one, and is otherwise chosen somewhat

      arbitrarily. The hierarchies property can be used to inspect the exhaustive
      list of

      parent divisions.'
  admin_level:
    type: int32
    minimum: -2147483648
    maximum: 2147483647
    description: 'Integer representing the division''s position in its country''s
      administrative

      hierarchy, where lower numbers correspond to higher level administrative units.'
  class:
    type: string
    enum:
    - megacity
    - city
    - town
    - village
    - hamlet
    description: A more specific classification of the division than is provided by
      `subtype`.
  local_type:
    type: object
    patternProperties:
      ? ^(?:(?:[A-Za-z]{2,3}(?:-[A-Za-z]{3}){0,3}?)|(?:[A-Za-z]{4,8}))(?:-[A-Za-z]{4})?(?:-[A-Za-z]{2}|[0-9]{3})?(?:-(?:[A-Za-z0-9]{5,8}|[0-9][A-Za-z0-9]{3}))*(?:-[A-WY-Za-wy-z0-9](?:-[A-Za-z0-9]{2,8})+)*$
      : type: string
        pattern: ^(\S(.*\S)?)?\Z
    description: 'Local name for the subtype property, optionally localized.


      For example, the Canadian province of Quebec has the subtype `"region"`, but
      in the

      local administrative hierarchy it is referred to as a province. Similarly, the

      Canadian Yukon territory also has subtype `"region"`, but is locally called
      a

      territory.


      This property is localized using a standard Overture names structure. So for

      example, in Switzerland the top-level administrative subdivision corresponding
      to

      subtype ''region'' is the canton, which may be translated in each of Switzerland''s

      official languages as, ''canton'' in French, ''kanton'' in German, ''cantone''
      in Italian,

      and ''chantun'' in Romansh.'
  region:
    type: string
    pattern: ^[A-Z]{2}-[A-Z0-9]{1,3}$
    minLength: 4
    maxLength: 6
    description: "ISO 3166-2 principal subdivision code of the subdivision-like entity\
      \ this division\nrepresents or belongs to.\n\nIf the entity this division represents\
      \ has a principal subdivision code, the region\nproperty contains it. If it\
      \ does not, the region property contains the principal\nsubdivision code of\
      \ the first division encountered by traversing the\n`parent_division_id` chain\
      \ to the root.\n\nFor example:\n- The region value for the United States is\
      \ omitted.\n- The region value for the U.S. state of New York is 'US-NY'.\n\
      - The region value for New York City is 'US-NY', which it inherits from the\
      \ state\n  of New York.\n- The region value for Puerto Rico is 'US-PR'."
  perspectives:
    type: object
    properties:
      mode:
        type: string
        enum:
        - accepted_by
        - disputed_by
        description: Whether the perspective holder accepts or disputes this name.
      countries:
        type: array
        items:
          type: string
          pattern: ^[A-Z]{2}$
          minLength: 2
          maxLength: 2
        minItems: 1
        uniqueItems: true
        description: Countries holding the given mode of perspective.
    required:
    - mode
    - countries
    description: "Political perspectives from which this division is considered to\
      \ be an accurate\nrepresentation.\n\nIf this property is absent, then this division\
      \ is not known to be disputed from\nany political perspective. Consequently,\
      \ there is only one division feature\nrepresenting the entire real world entity.\n\
      \nIf this property is present, it means the division represents one of several\n\
      alternative perspectives on the same real-world entity.\n\nThere are two modes\
      \ of perspective:\n\n1. `accepted_by` means the representation of the division\
      \ is accepted by the\n   listed entities and would be included on a map drawn\
      \ from their perspective.\n\n2. `disputed_by` means the representation of the\
      \ division is disputed by the\n   listed entities and would be excluded from\
      \ a map drawn from their perspective.\n\nWhen drawing a map from the perspective\
      \ of a given country, one would start by\ngathering all the undisputed divisions\
      \ (with no `perspectives` property), and then\nadding to that first all divisions\
      \ explicitly accepted by the country, and second\nall divisions not explicitly\
      \ disputed by the country."
    additionalProperties: false
  norms:
    type: object
    properties:
      driving_side:
        type: string
        enum:
        - left
        - right
        description: Side of the road on which vehicles drive in the division.
    description: 'Collects information about local norms and rules within the division
      that are

      generally useful for mapping and map-related use cases.


      If the norms property or a desired sub-property of the norms property is missing

      on a division, but at least one of its ancestor divisions has the norms property

      and the desired sub-property, then the value from the nearest ancestor division

      may be assumed.'
    additionalProperties: false
  population:
    type: int32
    minimum: -2147483648
    maximum: 2147483647
    description: Population of the division
  capital_division_ids:
    type: array
    items:
      type: string
      minLength: 1
      pattern: ^\S+$
    minItems: 1
    uniqueItems: true
    description: 'Division IDs of this division''s capital divisions. If present,
      this property will

      refer to the division IDs of the capital cities, county seats, etc. of a division.'
  capital_of_divisions:
    type: array
    items:
      type: object
      properties:
        division_id:
          type: string
          minLength: 1
          pattern: ^\S+$
          description: ID of the division whose capital is the current division.
        subtype:
          type: string
          enum:
          - country
          - dependency
          - macroregion
          - region
          - macrocounty
          - county
          - localadmin
          - locality
          - borough
          - macrohood
          - neighborhood
          - microhood
      required:
      - division_id
      - subtype
      description: A division of which the owning division is the capital, together
        with its subtype.
      additionalProperties: false
    minItems: 1
    uniqueItems: true
    description: Division IDs and subtypes of divisions this division is a capital
      of.
  wikidata:
    type: string
    pattern: ^Q\d+$
    description: A wikidata ID, as found on https://www.wikidata.org/
