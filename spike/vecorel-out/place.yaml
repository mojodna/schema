$schema: https://vecorel.org/sdl/v0.2.0/schema.json
required:
- id
- geometry
- theme
- type
- version
properties:
  id:
    type: string
    minLength: 1
    pattern: ^\S+$
    description: "A feature ID. This may be an ID associated with the Global Entity\
      \ Reference System (GERS) if\u2014and-only-if the feature represents an entity\
      \ that is part of GERS."
  bbox:
    type: bounding-box
    description: An optional bounding box for the feature
  geometry:
    type: geometry
    geometryTypes:
    - Point
    description: Position of the place. Places are point geometries.
  theme:
    type: string
    enum:
    - places
  type:
    type: string
    enum:
    - place
  version:
    type: int32
    minimum: -2147483648
    maximum: 2147483647
  sources:
    type: array
    items:
      type: object
      properties:
        property:
          type: string
          description: 'A JSON Pointer identifying the property (field) that this
            source information applies to.


            The root document value `""` indicates that this source information applies
            to the

            entire feature, excepting properties (fields) for which a dedicated source
            information

            record exists.


            Any other JSON Pointer apart from `""` indicates that this source record
            provides

            dedicated source information for the property at the path in the JSON
            Pointer. As an

            example, the value `"/names/common/en"` indicates that the source information
            applies to

            the English common name of a named feature, while the value `"/geometry"`
            indicates that

            it applies to the feature geometry.'
        dataset:
          type: string
          description: Name of the dataset where the source data can be found.
        license:
          type: string
          pattern: ^(\S(.*\S)?)?\Z
          description: 'Source data license name.


            This should be a valid SPDX license identifier when available.


            If omitted, contact the data provider for more license information.'
        record_id:
          type: string
          description: 'Identifies the specific record within the source dataset where
            the source data can

            be found.


            The format of record identifiers is dataset-specific.'
        update_time:
          type: date-time
          description: Last update time of the source data record.
        confidence:
          type: double
          minimum: 0.0
          maximum: 1.0
          description: 'Confidence value from the source dataset.


            This is a value between 0.0 and 1.0 and is particularly relevant for ML-derived
            data.'
        provider:
          type: string
          minLength: 1
          pattern: ^[a-z0-9]+(_[a-z0-9]+)*$
          description: 'The provider label for the entity that contributed this data

            (e.g., osm, meta, esri).'
        resource:
          type: string
          minLength: 1
          pattern: ^[a-z0-9]+(_[a-z0-9]+)*$
          description: 'The subject or type of data contributed by the provider

            (e.g., planet, buildings, division_names).'
        version:
          type: string
          minLength: 1
          pattern: ^\S+$
          description: 'A sortable identifier for the specific snapshot of the resource

            (e.g., 2026-02-13, 5.3, A5692).'
        between:
          type: array
          items:
            type: double
            minimum: 0.0
            maximum: 1.0
          minItems: 2
          maxItems: 2
          description: The linearly-referenced sub-segment of the geometry, specified
            as a range (pair) of percentage displacements from the start of the geometry,
            that the containing SourceItem applies to.
      required:
      - property
      description: Specifies the source of the data used for a feature or one of its
        properties.
      additionalProperties: false
    minItems: 1
    uniqueItems: true
    description: Information about the source data used to assemble the feature.
  operating_status:
    type: string
    enum:
    - open
    - permanently_closed
    - temporarily_closed
    description: 'An indication of whether a place is: in continued operation, in
      a temporary

      operating hiatus, or closed permanently.


      This is not an indication of opening hours or that the place is open/closed
      at the

      current time-of-day or day-of-week.


      When `operating_status` is `"permanently_closed"`, the `confidence` field will
      be

      set to 0.'
  categories:
    type: object
    properties:
      primary:
        type: string
        pattern: ^[a-z0-9]+(_[a-z0-9]+)*$
        description: The primary or main category of the place.
      alternate:
        type: array
        items:
          type: string
          pattern: ^[a-z0-9]+(_[a-z0-9]+)*$
        uniqueItems: true
        description: 'Alternate categories of the place.


          Some places might fit into two categories, e.g., a book store and a coffee
          shop. In

          these cases, the primary category can be augmented with additional categories.'
    required:
    - primary
    description: 'Categories a place belongs to.


      Complete list is available on GitHub: https://github.com/OvertureMaps/schema/blob/main/docs/schema/concepts/by-theme/places/overture_categories.csv'
    additionalProperties: false
  basic_category:
    type: string
    pattern: ^[a-z0-9]+(_[a-z0-9]+)*$
    description: 'The basic level category of a place.


      This field classifies places into categories at a level that most people find

      intuitive. The full list of possible values it may hold can be found at (TODO).


      The basic level category, or simply basic category, is based on a cognitive
      science

      model use in taxonomy and ontology development. The idea is to provide the category

      name at the level of generality that is preferred by humans in learning and
      memory

      tasks. This category to be roughly in the middle of the general-to-specific
      category

      hierarchy.


      The full list of basic level categories is available at https://docs.overturemaps.org/guides/places/'
  taxonomy:
    type: object
    properties:
      primary:
        type: string
        pattern: ^[a-z0-9]+(_[a-z0-9]+)*$
        description: '

          The primary, or most specific, category known about this place.


          The `primary` category value must always equal the last or rightmost entry
          in the `hierarchy` field.

          '
      hierarchy:
        type: array
        items:
          type: string
          pattern: ^[a-z0-9]+(_[a-z0-9]+)*$
        minItems: 1
        uniqueItems: true
        description: 'The full primary hierarchy of categories known for this place,
          ordered from most general to most specific.

          An example hierarchy might be: `["food_and_drink", "restaurant", "casual_eatery",
          "gas_station_sushi"]`.


          The rightmost, or most specific, value in the `hierarchy` must always be
          equal to the `primary` field.

          The basic level category of the place will typically be found in the middle
          of the primary hierarchy.

          The primary hierarchy does not include any of the alternate categories found
          in the `alternates` field.'
      alternates:
        type: array
        items:
          type: string
          pattern: ^[a-z0-9]+(_[a-z0-9]+)*$
        minItems: 1
        uniqueItems: true
        description: 'Unordered list of additional categories that are known for this

          place but that are not part of the primary category hierarchy.


          Alternate categories allow a more complete picture of the place

          to be surfaced when it fits multiple unconnected branches in the

          taxonomy. For example a gas station that also sells groceries

          might have primary category of "gas_station" with an alternate

          of "grocery_store".


          Alternate categories are not part of the primary hierarchy or

          another alternate category''s hierarchy.

          In other words, if a category is a parent in the hierarchy of another category,

          that category can''t be a primary or alternate category itself.


          Note as well that this field is an unordered list of extra

          categories and does not represent a hierarchy.'
    required:
    - primary
    - hierarchy
    description: 'A structured representation of the place''s category within the
      Overture taxonomy.


      Provides the primary classification, full hierarchy path, and alternate categories.'
    additionalProperties: false
  confidence:
    type: double
    minimum: 0.0
    maximum: 1.0
    description: 'A score between 0 and 1 indicating how confident we are that the
      place exists.


      A confidence score of 0 indicates that we are certain the place doesn''t exist

      anymore and will always be paired with an `operating_status` of

      `"permanently_closed"`.


      A confidence score of 1 indicates that we are certain the place does exist.


      If there is no value for confidence, it means we don''t have enough information
      on

      which to estimate our confidence level.'
  websites:
    type: array
    items:
      type: string
      format: uri
    minItems: 1
    uniqueItems: true
    description: The websites of the place.
  socials:
    type: array
    items:
      type: string
      format: uri
    minItems: 1
    uniqueItems: true
    description: The social media URLs of the place.
  emails:
    type: array
    items:
      type: string
      format: email
    minItems: 1
    uniqueItems: true
    description: The email addresses of the place.
  phones:
    type: array
    items:
      type: string
      pattern: ^\+\d{1,3}[\s\-\(\)0-9]+$
    minItems: 1
    uniqueItems: true
    description: The phone numbers of the place.
  brand:
    type: object
    properties:
      names:
        type: object
        properties:
          primary:
            type: string
            minLength: 1
            pattern: ^(\S(.*\S)?)?\Z
            description: The most commonly used name.
          common:
            type: object
            patternProperties:
              ? ^(?:(?:[A-Za-z]{2,3}(?:-[A-Za-z]{3}){0,3}?)|(?:[A-Za-z]{4,8}))(?:-[A-Za-z]{4})?(?:-[A-Za-z]{2}|[0-9]{3})?(?:-(?:[A-Za-z0-9]{5,8}|[0-9][A-Za-z0-9]{3}))*(?:-[A-WY-Za-wy-z0-9](?:-[A-Za-z0-9]{2,8})+)*$
              : type: string
                pattern: ^(\S(.*\S)?)?\Z
          rules:
            type: array
            items:
              type: object
              properties:
                value:
                  type: string
                  minLength: 1
                  pattern: ^(\S(.*\S)?)?\Z
                  description: The actual name value.
                variant:
                  type: string
                  enum:
                  - common
                  - official
                  - alternate
                  - short
                  description: The name variant for this name rule.
                language:
                  type: string
                  pattern: ^(?:(?:[A-Za-z]{2,3}(?:-[A-Za-z]{3}){0,3}?)|(?:[A-Za-z]{4,8}))(?:-[A-Za-z]{4})?(?:-[A-Za-z]{2}|[0-9]{3})?(?:-(?:[A-Za-z0-9]{5,8}|[0-9][A-Za-z0-9]{3}))*(?:-[A-WY-Za-wy-z0-9](?:-[A-Za-z0-9]{2,8})+)*$
                  description: 'The language in which the name `value` is specified,
                    if known, as an IETF BCP 47

                    language tag.'
                perspectives:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum:
                      - accepted_by
                      - disputed_by
                      description: Whether the perspective holder accepts or disputes
                        this name.
                    countries:
                      type: array
                      items:
                        type: string
                        pattern: ^[A-Z]{2}$
                        minLength: 2
                        maxLength: 2
                      minItems: 1
                      uniqueItems: true
                      description: Countries holding the given mode of perspective.
                  required:
                  - mode
                  - countries
                  description: Political perspectives from which a named feature is
                    viewed.
                  additionalProperties: false
                between:
                  type: array
                  items:
                    type: double
                    minimum: 0.0
                    maximum: 1.0
                  minItems: 2
                  maxItems: 2
                  description: The linearly-referenced sub-segment of the geometry,
                    specified as a range (pair) of percentage displacements from the
                    start of the geometry, that the containing NameRule applies to.
                side:
                  type: string
                  enum:
                  - left
                  - right
                  description: The side, either left or right, that the containing
                    NameRule applies to.
              required:
              - value
              - variant
              description: "A rule that can be evaluated to determine the name in\
                \ advanced scenarios.\n\nName rules are used for cases where the primary\
                \ name is not sufficient; the common name is not\nthe right fit for\
                \ the use case and another variant is needed; or where the name only\
                \ applies in\ncertain specific circumstances.\n\nExamples might include:\n\
                - An official, alternate, or short name.\n- A name that only applies\
                \ to part of a linear path like a road segment (geometric range\n\
                \  scoping).\n- A name that only applies to the left or right side\
                \ of a linear path like a road segment (side\n  scoping).\n- A name\
                \ that is only accepted by some political perspectives."
              additionalProperties: false
            description: Rules for names that cannot be specified in the simple common
              names property. These rules can cover other name variants such as official,
              alternate, and short; and they can optionally include geometric scoping
              (linear referencing) and side-of-road scoping for complex cases.
        required:
        - primary
        description: All known names by which the feature is called
        additionalProperties: false
      wikidata:
        type: string
        pattern: ^Q\d+$
        description: A wikidata ID, as found on https://www.wikidata.org/
    description: The brand associated with the place.
    additionalProperties: false
  addresses:
    type: array
    items:
      type: object
      properties:
        freeform:
          type: string
          description: Free-form address that contains street name, house number and
            other address info
        locality:
          type: string
          description: City, town, or neighborhood component of the place address
        postcode:
          type: string
          description: Postal code component of the place address
        region:
          type: string
          pattern: ^[A-Z]{2}-[A-Z0-9]{1,3}$
          minLength: 4
          maxLength: 6
          description: An ISO 3166-2 principal subdivision code
        country:
          type: string
          pattern: ^[A-Z]{2}$
          minLength: 2
          maxLength: 2
          description: An ISO 3166-1 alpha-2 country code
      description: An address associated with a place.
      additionalProperties: false
    minItems: 1
    description: The address or addresses of the place
  names:
    type: object
    properties:
      primary:
        type: string
        minLength: 1
        pattern: ^(\S(.*\S)?)?\Z
        description: The most commonly used name.
      common:
        type: object
        patternProperties:
          ? ^(?:(?:[A-Za-z]{2,3}(?:-[A-Za-z]{3}){0,3}?)|(?:[A-Za-z]{4,8}))(?:-[A-Za-z]{4})?(?:-[A-Za-z]{2}|[0-9]{3})?(?:-(?:[A-Za-z0-9]{5,8}|[0-9][A-Za-z0-9]{3}))*(?:-[A-WY-Za-wy-z0-9](?:-[A-Za-z0-9]{2,8})+)*$
          : type: string
            pattern: ^(\S(.*\S)?)?\Z
      rules:
        type: array
        items:
          type: object
          properties:
            value:
              type: string
              minLength: 1
              pattern: ^(\S(.*\S)?)?\Z
              description: The actual name value.
            variant:
              type: string
              enum:
              - common
              - official
              - alternate
              - short
              description: The name variant for this name rule.
            language:
              type: string
              pattern: ^(?:(?:[A-Za-z]{2,3}(?:-[A-Za-z]{3}){0,3}?)|(?:[A-Za-z]{4,8}))(?:-[A-Za-z]{4})?(?:-[A-Za-z]{2}|[0-9]{3})?(?:-(?:[A-Za-z0-9]{5,8}|[0-9][A-Za-z0-9]{3}))*(?:-[A-WY-Za-wy-z0-9](?:-[A-Za-z0-9]{2,8})+)*$
              description: 'The language in which the name `value` is specified, if
                known, as an IETF BCP 47

                language tag.'
            perspectives:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                  - accepted_by
                  - disputed_by
                  description: Whether the perspective holder accepts or disputes
                    this name.
                countries:
                  type: array
                  items:
                    type: string
                    pattern: ^[A-Z]{2}$
                    minLength: 2
                    maxLength: 2
                  minItems: 1
                  uniqueItems: true
                  description: Countries holding the given mode of perspective.
              required:
              - mode
              - countries
              description: Political perspectives from which a named feature is viewed.
              additionalProperties: false
            between:
              type: array
              items:
                type: double
                minimum: 0.0
                maximum: 1.0
              minItems: 2
              maxItems: 2
              description: The linearly-referenced sub-segment of the geometry, specified
                as a range (pair) of percentage displacements from the start of the
                geometry, that the containing NameRule applies to.
            side:
              type: string
              enum:
              - left
              - right
              description: The side, either left or right, that the containing NameRule
                applies to.
          required:
          - value
          - variant
          description: "A rule that can be evaluated to determine the name in advanced\
            \ scenarios.\n\nName rules are used for cases where the primary name is\
            \ not sufficient; the common name is not\nthe right fit for the use case\
            \ and another variant is needed; or where the name only applies in\ncertain\
            \ specific circumstances.\n\nExamples might include:\n- An official, alternate,\
            \ or short name.\n- A name that only applies to part of a linear path\
            \ like a road segment (geometric range\n  scoping).\n- A name that only\
            \ applies to the left or right side of a linear path like a road segment\
            \ (side\n  scoping).\n- A name that is only accepted by some political\
            \ perspectives."
          additionalProperties: false
        description: Rules for names that cannot be specified in the simple common
          names property. These rules can cover other name variants such as official,
          alternate, and short; and they can optionally include geometric scoping
          (linear referencing) and side-of-road scoping for complex cases.
    required:
    - primary
    description: All known names by which the feature is called
    additionalProperties: false
