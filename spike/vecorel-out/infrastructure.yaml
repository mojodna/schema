    - manhole
    - pedestrian
    - pier
    - power
    - quay
    - recreation
    - tower
    - transit
    - transportation
    - utility
    - waste_management
    - water
  height:
    type: double
    exclusiveMinimum: 0
    description: Height of the feature in meters.
  surface:
    type: string
    enum:
    - asphalt
    - cobblestone
    - compacted
    - concrete
    - concrete_plates
    - dirt
    - earth
    - fine_gravel
    - grass
    - gravel
    - ground
    - paved
    - paving_stones
    - pebblestone
    - recreation_grass
    - recreation_paved
    - recreation_sand
    - rubber
    - sand
    - sett
    - tartan
    - unpaved
    - wood
    - woodchips
  names:
    type: object
    properties:
      primary:
        type: string
        minLength: 1
        pattern: ^(\S(.*\S)?)?\Z
        description: The most commonly used name.
      common:
        type: object
        patternProperties:
          ? ^(?:(?:[A-Za-z]{2,3}(?:-[A-Za-z]{3}){0,3}?)|(?:[A-Za-z]{4,8}))(?:-[A-Za-z]{4})?(?:-[A-Za-z]{2}|[0-9]{3})?(?:-(?:[A-Za-z0-9]{5,8}|[0-9][A-Za-z0-9]{3}))*(?:-[A-WY-Za-wy-z0-9](?:-[A-Za-z0-9]{2,8})+)*$
          : type: string
            pattern: ^(\S(.*\S)?)?\Z
      rules:
        type: array
        items:
          type: object
          properties:
            value:
              type: string
              minLength: 1
              pattern: ^(\S(.*\S)?)?\Z
              description: The actual name value.
            variant:
              type: string
              enum:
              - common
              - official
              - alternate
              - short
              description: The name variant for this name rule.
            language:
              type: string
              pattern: ^(?:(?:[A-Za-z]{2,3}(?:-[A-Za-z]{3}){0,3}?)|(?:[A-Za-z]{4,8}))(?:-[A-Za-z]{4})?(?:-[A-Za-z]{2}|[0-9]{3})?(?:-(?:[A-Za-z0-9]{5,8}|[0-9][A-Za-z0-9]{3}))*(?:-[A-WY-Za-wy-z0-9](?:-[A-Za-z0-9]{2,8})+)*$
              description: 'The language in which the name `value` is specified, if
                known, as an IETF BCP 47

                language tag.'
            perspectives:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                  - accepted_by
                  - disputed_by
                  description: Whether the perspective holder accepts or disputes
                    this name.
                countries:
                  type: array
                  items:
                    type: string
                    pattern: ^[A-Z]{2}$
                    minLength: 2
                    maxLength: 2
                  minItems: 1
                  uniqueItems: true
                  description: Countries holding the given mode of perspective.
              required:
              - mode
              - countries
              description: Political perspectives from which a named feature is viewed.
              additionalProperties: false
            between:
              type: array
              items:
                type: double
                minimum: 0.0
                maximum: 1.0
              minItems: 2
              maxItems: 2
              description: The linearly-referenced sub-segment of the geometry, specified
                as a range (pair) of percentage displacements from the start of the
                geometry, that the containing NameRule applies to.
            side:
              type: string
              enum:
              - left
              - right
              description: The side, either left or right, that the containing NameRule
                applies to.
          required:
          - value
          - variant
          description: "A rule that can be evaluated to determine the name in advanced\
            \ scenarios.\n\nName rules are used for cases where the primary name is\
            \ not sufficient; the common name is not\nthe right fit for the use case\
            \ and another variant is needed; or where the name only applies in\ncertain\
            \ specific circumstances.\n\nExamples might include:\n- An official, alternate,\
            \ or short name.\n- A name that only applies to part of a linear path\
            \ like a road segment (geometric range\n  scoping).\n- A name that only\
            \ applies to the left or right side of a linear path like a road segment\
            \ (side\n  scoping).\n- A name that is only accepted by some political\
            \ perspectives."
          additionalProperties: false
        description: Rules for names that cannot be specified in the simple common
          names property. These rules can cover other name variants such as official,
          alternate, and short; and they can optionally include geometric scoping
          (linear referencing) and side-of-road scoping for complex cases.
    required:
    - primary
    description: All known names by which the feature is called
    additionalProperties: false
  level:
    type: int32
    minimum: -2147483648
    maximum: 2147483647
    description: Z-order of the feature where 0 is visual level
  source_tags:
    type: object
    additionalProperties: {}
    description: 'Key/value pairs imported directly from the source data without change.


      This field provides access to raw OSM entity tags for features sourced from

      OpenStreetMap.'
  wikidata:
    type: string
    pattern: ^Q\d+$
    description: A wikidata ID, as found on https://www.wikidata.org/
